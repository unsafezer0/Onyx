<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- The clip path is in the local coordinate system of the translated group -->
    <clipPath id="aperture-clip">
      <circle cx="0" cy="0" r="180" />
    </clipPath>
  </defs>

  <!-- Outermost accent ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#d97757" stroke-width="8" opacity="0.5" />
  
  <!-- Main dark ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#262624" stroke-width="40" />

  <!-- Aperture Blades -->
  <g transform="translate(256, 256)" clip-path="url(#aperture-clip)">
    <!-- 
      P1 = (40, 69.282)
      Triangle spanning far outside the r=180 circle 
    -->
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#d97757" stroke="#d97757" stroke-width="1" />
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#e8a855" stroke="#e8a855" stroke-width="1" transform="rotate(60)" />
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#619e66" stroke="#619e66" stroke-width="1" transform="rotate(120)" />
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#4988a8" stroke="#4988a8" stroke-width="1" transform="rotate(180)" />
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#5e548c" stroke="#5e548c" stroke-width="1" transform="rotate(240)" />
    <polygon points="40,69.282 500,-727.468 500,69.282" fill="#a8546f" stroke="#a8546f" stroke-width="1" transform="rotate(300)" />
  </g>
</svg>
